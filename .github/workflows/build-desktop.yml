name: Build & Publish Desktop App

on:
  workflow_dispatch:
    inputs:
      build-mac:
        description: 'Build macOS App'
        required: false
        type: boolean
        default: true
      build-windows:
        description: 'Build Windows App'
        required: false
        type: boolean
        default: true
      build-linux:
        description: 'Build Linux App'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check-branch:
    name: Validate Branch
    runs-on: ubuntu-latest
    steps:
      - name: Assert development branch
        run: |
          echo "Triggered branch: ${{ github.ref_name }}"
          if [ "${{ github.ref_name }}" != "development" ]; then
            echo "Error: This workflow can only be manually run on the 'development' branch."
            exit 1
          fi

  bump-version:
    name: Bump Version
    needs: check-branch
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      skipped: ${{ steps.changelog.outputs.skipped }}
      tag: ${{ steps.changelog.outputs.tag }}
      version: ${{ steps.changelog.outputs.version }}
      clean_changelog: ${{ steps.changelog.outputs.clean_changelog }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PA_TOKEN }}
          fetch-depth: 0

      - name: Conventional Changelog Action
        id: changelog
        uses: TriPSs/conventional-changelog-action@latest
        with:
          github-token: ${{ secrets.PA_TOKEN }}
          git-user-name: 'Telegramonic bot'
          output-file: false
          version-file: 'apps/desktop/package.json'
          git-path: 'apps/desktop'
          tag-prefix: 'desktop-v'
          skip-on-empty: 'false'
          skip-commit: 'true'
          git-push: 'false'

  setup-matrix:
    name: Setup Build Matrix
    needs: check-branch
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      has-targets: ${{ steps.set-matrix.outputs.has-targets }}
    steps:
      - name: Generate Matrix JSON
        id: set-matrix
        run: |
          MATRIX_ITEMS="[]"
          if [ "${{ inputs.build-mac }}" = "true" ]; then
            MATRIX_ITEMS=$(echo "$MATRIX_ITEMS" | jq -c '. + [{"os": "macos-latest", "platform": "mac", "artifact-path": "apps/desktop/dist/", "artifact-name": "desktop-build-macos", "server-binary": "apps/server/target/release/telegramonic-server", "release-assets": "apps/desktop/dist/*.dmg"}]')
          fi
          if [ "${{ inputs.build-windows }}" = "true" ]; then
            MATRIX_ITEMS=$(echo "$MATRIX_ITEMS" | jq -c '. + [{"os": "windows-latest", "platform": "win", "artifact-path": "apps/desktop/dist/", "artifact-name": "desktop-build-windows", "server-binary": "apps/server/target/release/telegramonic-server.exe", "release-assets": "apps/desktop/dist/*.exe"}]')
          fi
          if [ "${{ inputs.build-linux }}" = "true" ]; then
            MATRIX_ITEMS=$(echo "$MATRIX_ITEMS" | jq -c '. + [{"os": "ubuntu-latest", "platform": "linux", "artifact-path": "apps/desktop/dist/", "artifact-name": "desktop-build-linux", "server-binary": "apps/server/target/release/telegramonic-server", "release-assets": "apps/desktop/dist/*.AppImage\napps/desktop/dist/*.deb"}]')
          fi

          HAS_TARGETS="false"
          if [ "$MATRIX_ITEMS" != "[]" ]; then
            HAS_TARGETS="true"
          fi

          echo "matrix={\"include\":$MATRIX_ITEMS}" >> $GITHUB_OUTPUT
          echo "has-targets=$HAS_TARGETS" >> $GITHUB_OUTPUT

  build-frontend:
    name: Build Frontend
    needs: [check-branch, bump-version, setup-matrix]
    if: ${{ needs.bump-version.outputs.skipped == 'false' && needs.setup-matrix.outputs.has-targets == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PA_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable Corepack
        run: corepack enable

      - name: Install Dependencies
        run: yarn install --immutable

      - name: Build Desktop React App
        run: yarn workspace telegramonic-desktop build

      - name: Upload Frontend Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-frontend-build
          path: apps/desktop/build/
          retention-days: 1

  build-desktop:
    name: Build Desktop App (${{ matrix.os }})
    needs: [check-branch, bump-version, setup-matrix, build-frontend]
    if: ${{ needs.bump-version.outputs.skipped == 'false' && needs.setup-matrix.outputs.has-targets == 'true' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup-matrix.outputs.matrix) }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PA_TOKEN }}

      - name: Download Frontend Build
        uses: actions/download-artifact@v4
        with:
          name: desktop-frontend-build
          path: apps/desktop/build

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable Corepack
        run: corepack enable

      - name: Install Dependencies
        run: yarn install --immutable

      - name: Update package.json version
        run: |
          node -e "const fs = require('fs'); const pkg = require('./apps/desktop/package.json'); pkg.version = '${{ needs.bump-version.outputs.version }}'; fs.writeFileSync('./apps/desktop/package.json', JSON.stringify(pkg, null, 2));"

      # Setup Rust toolchain for server build
      - name: Setup Rust Toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1

      # Build Rust Server Backend in Release mode
      - name: Build Rust Server
        run: cargo build --release
        working-directory: apps/server

      # Package using electron-builder
      - name: Build & Package Desktop App
        run: npx electron-builder --${{ matrix.platform }} --publish never
        working-directory: apps/desktop
        env:
          GH_TOKEN: ${{ secrets.PA_TOKEN }}

      - name: Upload Desktop Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: |
            ${{ matrix.server-binary }}
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.AppImage
            apps/desktop/dist/*.deb
          retention-days: 1
          if-no-files-found: ignore

  release-desktop:
    name: Release Desktop App
    needs: [bump-version, build-desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PA_TOKEN }}
          fetch-depth: 0

      - name: Conventional Changelog Action
        id: changelog
        uses: TriPSs/conventional-changelog-action@latest
        with:
          github-token: ${{ secrets.PA_TOKEN }}
          git-user-name: 'Telegramonic bot'
          output-file: false
          version-file: 'apps/desktop/package.json'
          git-path: 'apps/desktop'
          tag-prefix: 'desktop-v'
          skip-on-empty: 'false'

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Publish Release to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.changelog.outputs.tag }}
          name: ${{ steps.changelog.outputs.tag }}
          body: ${{ steps.changelog.outputs.clean_changelog }}
          files: |
            release-artifacts/**/*.dmg
            release-artifacts/**/*.exe
            release-artifacts/**/*.AppImage
            release-artifacts/**/*.deb
            release-artifacts/**/telegramonic-server
            release-artifacts/**/telegramonic-server.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.PA_TOKEN }}
