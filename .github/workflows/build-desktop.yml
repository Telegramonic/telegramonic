name: Build & Publish Desktop App

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-branch:
    name: Validate Branch
    runs-on: ubuntu-latest
    steps:
      - name: Assert development branch
        run: |
          echo "Triggered branch: ${{ github.ref_name }}"
          if [ "${{ github.ref_name }}" != "development" ]; then
            echo "Error: This workflow can only be manually run on the 'development' branch."
            exit 1
          fi

  bump-version:
    name: Bump Version
    needs: check-branch
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      skipped: ${{ steps.changelog.outputs.skipped }}
      tag: ${{ steps.changelog.outputs.tag }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PA_TOKEN }}
          fetch-depth: 0

      - name: Conventional Changelog Action
        id: changelog
        uses: TriPSs/conventional-changelog-action@latest
        with:
          github-token: ${{ secrets.PA_TOKEN }}
          git-user-name: 'Telegramonic bot'
          output-file: false
          version-file: 'desktop/package.json'
          git-path: 'desktop/package.json'
          tag-prefix: 'desktop-v'

  build-frontend:
    name: Build Frontend
    needs: [check-branch, bump-version]
    if: ${{ needs.bump-version.outputs.skipped == 'false' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PA_TOKEN }}
          ref: ${{ needs.bump-version.outputs.tag }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable Corepack
        run: corepack enable

      - name: Install Dependencies
        run: yarn install --immutable

      - name: Build Desktop React App
        run: yarn workspace telegramonic-desktop build

      - name: Upload Frontend Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-frontend-build
          path: desktop/build/
          retention-days: 1

  build-desktop:
    name: Build Desktop App (${{ matrix.os }})
    needs: [check-branch, bump-version, build-frontend]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
            artifact-path: desktop/dist/
            artifact-name: desktop-build-macos
            server-binary: server/target/release/telegramonic-server
          - os: windows-latest
            platform: win
            artifact-path: desktop/dist/
            artifact-name: desktop-build-windows
            server-binary: server/target/release/telegramonic-server.exe
          - os: ubuntu-latest
            platform: linux
            artifact-path: desktop/dist/
            artifact-name: desktop-build-linux
            server-binary: server/target/release/telegramonic-server

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PA_TOKEN }}
          ref: ${{ needs.bump-version.outputs.tag }}

      - name: Download Frontend Build
        uses: actions/download-artifact@v4
        with:
          name: desktop-frontend-build
          path: desktop/build

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable Corepack
        run: corepack enable

      - name: Install Dependencies
        run: yarn install --immutable

      # Setup Rust toolchain for server build
      - name: Setup Rust Toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1

      # Build Rust Server Backend in Release mode
      - name: Build Rust Server
        run: cargo build --release
        working-directory: server

      # Package using electron-builder and publish to GitHub Releases
      - name: Build & Package Desktop App
        run: npx electron-builder --${{ matrix.platform }} --publish always
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.PA_TOKEN }}

      - name: Publish Server Binary to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.bump-version.outputs.tag }}
          files: ${{ matrix.server-binary }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.PA_TOKEN }}
