name: Build & Publish Web App

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check-branch:
    name: Validate Branch
    runs-on: ubuntu-latest
    steps:
      - name: Assert development branch
        run: |
          echo "Triggered branch: ${{ github.ref_name }}"
          if [ "${{ github.ref_name }}" != "development" ]; then
            echo "Error: This workflow can only be manually run on the 'development' branch."
            exit 1
          fi

  build-web:
    name: Build Web App
    needs: check-branch
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PA_TOKEN }}
          fetch-depth: 0

      - name: Conventional Changelog Action
        id: changelog
        uses: TriPSs/conventional-changelog-action@latest
        with:
          github-token: ${{ secrets.PA_TOKEN }}
          git-user-name: 'Telegramonic bot'
          output-file: false
          version-file: 'apps/web/package.json'
          git-path: 'apps/web'
          tag-prefix: 'web-v'
          skip-on-empty: 'false'

      - name: Setup Node.js
        if: ${{ steps.changelog.outputs.skipped == 'false' }}
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable Corepack
        if: ${{ steps.changelog.outputs.skipped == 'false' }}
        run: corepack enable

      - name: Install Dependencies
        if: ${{ steps.changelog.outputs.skipped == 'false' }}
        run: yarn install --immutable

      - name: Build Web App
        if: ${{ steps.changelog.outputs.skipped == 'false' }}
        run: yarn web:build

      - name: Upload Web Build Artifacts
        if: ${{ steps.changelog.outputs.skipped == 'false' }}
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: apps/web/build/
          retention-days: 7

      - name: Zip Build Artifacts
        if: ${{ steps.changelog.outputs.skipped == 'false' }}
        run: |
          cd apps/web/build
          zip -r ../../web-build.zip .
          cd ../..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: ${{ steps.changelog.outputs.skipped == 'false' }}
        with:
          tag_name: ${{ steps.changelog.outputs.tag }}
          name: ${{ steps.changelog.outputs.tag }}
          body: ${{ steps.changelog.outputs.clean_changelog }}
          files: web-build.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.PA_TOKEN }}

      - name: 📂 Sync files
        if: ${{ steps.changelog.outputs.skipped == 'false' }}
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftp.telegramonic.com
          username: u392139545.githubdeploy
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          local-dir: apps/web/build/
          server-dir: ./
