name: Desktop CI

on:
  push:
    branches:
      - development
    paths:
      - 'apps/desktop/**'
      - 'shared/common/**'
      - 'shared/client-common/**'
      - 'package.json'
      - 'yarn.lock'
      - '.github/workflows/ci-desktop.yml'
  pull_request:
    branches:
      - development
    paths:
      - 'apps/desktop/**'
      - 'apps/mobile/**'
      - 'shared/common/**'
      - 'shared/client-common/**'
      - 'package.json'
      - 'yarn.lock'
      - '.github/workflows/ci-desktop.yml'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  desktop-ci:
    name: Lint, Build and Test Desktop
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Enable Corepack
        run: corepack enable

      - name: Install Dependencies
        run: yarn install --immutable

      - name: Lint
        run: yarn desktop:lint

      - name: Build Frontend
        run: yarn desktop:build

      - name: Test
        run: yarn desktop:test --watchAll=false --passWithNoTests
